<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録画面</title>
</head>
<body>
    <form action="/add" method="post" enctype="multipart/form-data">
        <p>
            <label for="name">作品名:</label>
            <input type="text" id="name" name="movie_name" required />
        </p>
        <p>
            <label for="genre">ジャンル:</label>
            <input type="text" id="genre" name="movie_genre" />
        </p>
        <p>
            <label for="watched_date">視聴日:</label>
            <input type="date" id="watched_date" name="movie_watched_date" />
        </p>
        <p>
            <label for="rating">評価:</label>
            <input type="number" id="rating" name="movie_rating" min="1" max="10" />
        </p>
        <p>
            <label for="review">感想:</label>
            <textarea id="review" name="movie_review"></textarea>
        </p>
        <p>
            <label for="image">ポスター画像:</label>
            <input type="file" id="image" name="movie_image" accept="image/*" />
        </p>
        <p>
            <button type="submit">登録する</button>
        </p>
    </form>
</body>
</html>
