<!DOCTYPE html>
<html lang="ja">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録画面</title>
</head>
<body>
    <form action="/add" method="post" enctype="multipart/form-data">
        <div style="position: relative;">
            <label for="tmdb-search">作品を検索（TMDbから自動入力）:</label>
            <input type="text" id="tmdb-search" placeholder="作品名を入力..." autocomplete="off">
            <div id="search-results" style="position: absolute; z-index: 10;"></div>
        </div>
        <p>
            <label for="name">作品名:</label>
            <input type="text" id="name" name="movie_name" required />
        </p>
        <p>
            <label for="genre">ジャンル:</label>
            <input type="text" id="genre" name="movie_genre" />
        </p>
        <p>
            <label for="watched_date">視聴日:</label>
            <input type="date" id="watched_date" name="movie_watched_date" />
        </p>
        <p>
            <label for="rating">評価:</label>
            <input type="number" id="rating" name="movie_rating" min="1" max="100" />
        </p>
        <p>
            <label for="review">感想:</label>
            <textarea id="review" name="movie_review"></textarea>
        </p>
        <p>
            <label for="image">ポスター画像:</label>
            <input type="file" id="image" name="movie_image" accept="image/*" />
        </p>
        <p>
            <label for="backdrop">背景シーン画像:</label>
            <input type="file" id="backdrop" name="movie_backdrop" accept="image/*" />
        </p>
        <p>
            <button type="submit">登録する</button>
        </p>
    </form>

    <script>
        const searchInput = document.getElementById('tmdb-search');
        const resultsBox = document.getElementById('search-results');

        searchInput.addEventListener('input', function() {
            const query = this.value;

            if (query.length < 1) {
                resultsBox.innerHTML = '';
                return;
            }

            fetch('/api/search_movie?query=' + encodeURIComponent(query))
                .then(response => response.json())
                .then(data => {
                    resultsBox.innerHTML = '';

                    data.forEach(movie => {
                        const item = document.createElement('div');
                        item.textContent = movie.title + '（' + (movie.release_date || '不明') + '）';
                        item.style.cursor = 'pointer';
                        item.style.padding = '4px';
                        item.style.background = '#1C1A22';

                        item.addEventListener('click', function() {
                            // ここは次のステップで実装します
                        });

                        resultsBox.appendChild(item);
                    });
                });
        });
    </script>
</body>
</html>
