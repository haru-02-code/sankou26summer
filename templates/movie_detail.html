<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品詳細</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0A0A0C; }
        .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.03em; }
    </style>
</head>
<body class="min-h-screen text-[#EDEBF0]">

    <!-- ヒーロー背景：登録した画像を暗くぼかして敷く -->
    <div class="relative h-[480px] overflow-hidden">
        {% if movie[6] %}
        <img src="/{{ movie[6] }}" class="absolute inset-0 w-full h-full object-cover blur-sm scale-110">
        {% endif %}
        <div class="absolute inset-0 bg-gradient-to-t from-[#0A0A0C] via-[#0A0A0C]/70 to-[#0A0A0C]/20"></div>

        <header class="relative max-w-6xl mx-auto px-6 py-5">
            <a href="{{ url_for('index') }}" class="font-display text-2xl tracking-wide">← 一覧に戻る</a>
        </header>

        <!-- ポスター＋主要情報 -->
        <div class="relative max-w-6xl mx-auto px-6 flex items-end gap-8 h-[340px]">
            <div class="w-44 aspect-[2/3] rounded shadow-2xl overflow-hidden flex-shrink-0 -mb-16 border-4 border-[#0A0A0C] bg-[#1C1A22]">
                {% if movie[6] %}
                <img src="/{{ movie[6] }}" class="w-full h-full object-cover">
                {% endif %}
            </div>
            <div class="pb-6">
                <p class="text-xs tracking-[0.2em] text-[#B8B4C0] uppercase mb-2">
                    {{ movie[2] }} / {{ movie[3] }} 視聴
                </p>
                <h1 class="font-display text-5xl mb-3">{{ movie[1] }}</h1>
                <div class="flex items-center gap-2">
                    <span class="bg-[#3ECF8E] text-[#0A0A0C] font-display text-2xl px-3 py-0.5 rounded">{{ movie[4] }}</span>
                    <span class="text-[#8B8795] text-sm">/ 10</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 感想・操作 -->
    <main class="max-w-6xl mx-auto px-6 mt-24">
        <div class="max-w-2xl">
            <h2 class="text-xs tracking-[0.2em] text-[#8B8795] uppercase mb-3">感想</h2>
            <p class="text-[#D9D6DE] leading-relaxed">
                {{ movie[5] }}
            </p>
        </div>

        <div class="flex gap-3 mt-10 pb-16">
            <a href="/edit/{{ movie[0] }}" class="border border-[#2A2932] text-[#B8B4C0] px-5 py-2 rounded text-sm hover:border-[#3ECF8E] hover:text-[#3ECF8E] transition-colors">編集する</a>
            <form action="/delete/{{ movie[0] }}" method="post">
                <button type="submit" class="border border-[#2A2932] text-[#B45D7A] px-5 py-2 rounded text-sm hover:border-[#B45D7A] transition-colors">削除する</button>
            </form>
        </div>
    </main>
</body>
</html>
