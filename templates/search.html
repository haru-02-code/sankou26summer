<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品を検索 - Watchive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        html { scrollbar-gutter: stable; }
        body { font-family: 'Inter', sans-serif; background-color: #0A0A0C; }
        .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.03em; }
        .font-title-jp { font-family: 'Zen Old Mincho', serif; font-weight: 700; }
        .poster { aspect-ratio: 2 / 3; }
        .poster-frame {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
            transition: box-shadow 0.15s ease-in;
            pointer-events: none;
        }
        .group:hover .poster-frame {
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body class="min-h-screen text-[#EDEBF0]">

    {% include 'header.html' %}

    <main class="max-w-6xl mx-auto px-6 mt-8 min-h-[60vh]">

        <!-- 映画／TVタブ -->
        <div class="flex gap-2 mb-4">
            <button id="tab-movie" class="tab-btn px-4 py-1.5 rounded text-sm bg-[#3ECF8E] text-[#0A0A0C]" data-type="movie">映画</button>
            <button id="tab-tv" class="tab-btn px-4 py-1.5 rounded text-sm bg-[#151418] text-[#B8B4C0]" data-type="tv">TV</button>
        </div>

        <!-- 検索ボックス（サジェスト付き） -->
        <div class="relative mb-8">
            <div class="flex gap-2">
                <input type="text" id="search-input" placeholder="作品名を入力..."
                        autocomplete="new-password" autocapitalize="off" spellcheck="false"
                        class="flex-1 bg-[#151418] border border-[#2A2932] text-sm text-[#EDEBF0] rounded px-4 py-2.5">
                <button id="search-btn" class="bg-[#3ECF8E] text-[#0A0A0C] text-sm font-semibold px-6 rounded hover:opacity-90">
                    検索
                </button>
            </div>
            <div id="suggest-box" class="absolute left-0 right-0 mt-1 bg-[#151418] border border-[#2A2932] rounded shadow-lg z-20 hidden overflow-hidden"></div>
        </div>

        <div id="results" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-4">
        </div>
        <p id="empty-message" class="text-[#8B8795] text-sm mt-8 hidden">作品名を入力して検索してください</p>
    </main>

    {% include 'footer.html' %}

    <script>
        // fetch APIによる非同期通信が中心のため、素のJavaScriptで実装

        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const resultsBox = document.getElementById('results');
        const emptyMessage = document.getElementById('empty-message');
        const suggestBox = document.getElementById('suggest-box');
        let currentType = 'movie';
        let debounceTimer;

        // タブ切り替え
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                currentType = this.dataset.type;

                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('bg-[#3ECF8E]', 'text-[#0A0A0C]');
                    b.classList.add('bg-[#151418]', 'text-[#B8B4C0]');
                });
                this.classList.remove('bg-[#151418]', 'text-[#B8B4C0]');
                this.classList.add('bg-[#3ECF8E]', 'text-[#0A0A0C]');

                if (searchInput.value.length > 0) {
                    runSearch();
                }
            });
        });

        // 検索ボタン・Enterキーで、確定検索を実行
        searchBtn.addEventListener('click', function() {
            suggestBox.classList.add('hidden');
            runSearch();
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                suggestBox.classList.add('hidden');
                runSearch();
            }
        });

        // 入力するたびに、サジェストを更新する（デバウンス付き）
        searchInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            const query = this.value;

            if (query.length < 1) {
                suggestBox.classList.add('hidden');
                return;
            }

            debounceTimer = setTimeout(() => {
                fetchResults(query).then(data => showSuggestions(data));
            }, 300);
        });

        // 検索バーの外をクリックしたら、サジェストを閉じる
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.relative')) {
                suggestBox.classList.add('hidden');
            }
        });

        // TMDbに実際に問い合わせる部分
        function fetchResults(query) {
            return fetch('/api/search_movie?query=' + encodeURIComponent(query) + '&type=' + currentType)
                .then(response => response.json());
        }

        // サジェスト候補（タイトル・公開年のみ）を表示する
        function showSuggestions(data) {
            suggestBox.innerHTML = '';

            if (data.length === 0) {
                suggestBox.classList.add('hidden');
                return;
            }

            // 公開日順に並び替えてから、上位5件だけ使う
            data.sort((a, b) => {
                const dateA = a.release_date || a.first_air_date || '';
                const dateB = b.release_date || b.first_air_date || '';
                return dateB.localeCompare(dateA);
            });

            data.slice(0, 5).forEach(item => {
                const title = item.title || item.name;
                const date = item.release_date || item.first_air_date || '';
                const year = date ? date.slice(0, 4) : '不明';

                const suggestItem = document.createElement('div');
                suggestItem.className = 'px-4 py-2.5 hover:bg-[#1C1A22] cursor-pointer text-sm border-b border-[#2A2932] last:border-b-0';
                suggestItem.innerHTML = `${title} <span class="text-[#6B6678] text-xs">(${year})</span>`;

                suggestItem.addEventListener('click', function() {
                    searchInput.value = title;
                    suggestBox.classList.add('hidden');
                    runSearch();
                });

                suggestBox.appendChild(suggestItem);
            });

            suggestBox.classList.remove('hidden');
        }

        // 検索を実行するたびに、履歴に追加する
        function saveSearchHistory(query) {
            let searchHistoryList = JSON.parse(localStorage.getItem('search_history') || '[]');
            searchHistoryList = searchHistoryList.filter(h => h !== query);
            searchHistoryList.unshift(query);
            searchHistoryList = searchHistoryList.slice(0, 10);
            localStorage.setItem('search_history', JSON.stringify(searchHistoryList));
        }

        // 確定検索（ボタン・Enter・サジェスト選択後に呼ばれる）
        function runSearch() {
            const query = searchInput.value;

            if (query.length < 1) {
                resultsBox.innerHTML = '';
                emptyMessage.classList.remove('hidden');
                return;
            }
            emptyMessage.classList.add('hidden');
            resultsBox.innerHTML = '<p class="text-[#8B8795] text-sm col-span-full">検索中...</p>';

            // URLに検索条件を反映する（ページ遷移はしない）
            const newUrl = `/search?query=${encodeURIComponent(query)}&type=${currentType}`;
            history.pushState({}, '', newUrl);

            fetchResults(query).then(data => {
                displayResults(data);
            });

            saveSearchHistory(query);
        }

        // 検索ボックスがクリックされたとき、空欄なら履歴を表示する
        searchInput.addEventListener('focus', function() {
            if (this.value.length < 1) {
                showSearchHistory();
            }
        });

        // 入力するたびに、サジェストまたは履歴を更新する
        searchInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            const query = this.value;

            if (query.length < 1) {
                showSearchHistory();
                return;
            }

            debounceTimer = setTimeout(() => {
                fetchResults(query).then(data => showSuggestions(data));
            }, 300);
        });

        function showSearchHistory() {
            const searchHistoryList = JSON.parse(localStorage.getItem('search_history') || '[]');

            if (searchHistoryList.length === 0) {
                suggestBox.classList.add('hidden');
                return;
            }

            suggestBox.innerHTML = '';

            searchHistoryList.forEach(term => {
                const item = document.createElement('div');
                item.className = 'px-4 py-2.5 hover:bg-[#1C1A22] cursor-pointer text-sm border-b border-[#2A2932] last:border-b-0 flex items-center gap-2.5';
                item.innerHTML = `
                    <svg class="w-3.5 h-3.5 text-[#6B6678] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"></circle>
                        <polyline points="12 7 12 12 15 14"></polyline>
                    </svg>
                    <span>${term}</span>
                `;

                item.addEventListener('click', function() {
                    searchInput.value = term;
                    suggestBox.classList.add('hidden');
                    runSearch();
                });

                suggestBox.appendChild(item);
            });

            suggestBox.classList.remove('hidden');
        }

        // 結果一覧（ポスターグリッド）を表示する
        function displayResults(data) {
            resultsBox.innerHTML = '';

            if (data.length === 0) {
                resultsBox.innerHTML = '<p class="text-[#8B8795] text-sm col-span-full">該当する作品が見つかりませんでした</p>';
                return;
            }

            data.sort((a, b) => {
                const dateA = a.release_date || a.first_air_date || '';
                const dateB = b.release_date || b.first_air_date || '';
                return dateB.localeCompare(dateA);
            });

            data.forEach(item => {
                const posterUrl = item.poster_path
                    ? 'https://image.tmdb.org/t/p/w300' + item.poster_path
                    : null;
                const title = item.title || item.name;
                const date = item.release_date || item.first_air_date || '';

                const card = document.createElement('a');
                card.href = '/movie/tmdb/' + currentType + '/' + item.id;
                card.className = 'group';
                card.innerHTML = `
                    <div class="poster rounded overflow-hidden bg-[#1C1A22] flex items-end p-2 relative">
                        ${posterUrl
                            ? `<img src="${posterUrl}" class="absolute inset-0 w-full h-full object-cover rounded">`
                            : `<span class="relative text-xs text-[#EDEBF0]/70 font-title-jp tracking-wide">${title}</span>`
                        }
                        <div class="poster-frame"></div>
                    </div>
                    <p class="text-[11px] text-[#8B8795] font-title-jp mt-1.5 truncate">${title}</p>
                    <p class="text-[10px] text-[#6B6678] truncate">${date}</p>
                `;
                resultsBox.appendChild(card);
            });
        }

        // ページ読み込み時、URLに検索条件があれば自動で復元する
        (function restoreFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const initialQuery = urlParams.get('query');
            const initialType = urlParams.get('type');

            if (initialType === 'tv') {
                currentType = 'tv';
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('bg-[#3ECF8E]', 'text-[#0A0A0C]');
                    b.classList.add('bg-[#151418]', 'text-[#B8B4C0]');
                });
                document.getElementById('tab-tv').classList.remove('bg-[#151418]', 'text-[#B8B4C0]');
                document.getElementById('tab-tv').classList.add('bg-[#3ECF8E]', 'text-[#0A0A0C]');
            }

            if (initialQuery) {
                searchInput.value = initialQuery;
                runSearch();
            }
        })();
    </script>
</body>
</html>
