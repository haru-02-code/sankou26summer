<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>視聴ログ一覧</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
    html { scrollbar-gutter: stable; }
    body { font-family: 'Inter', sans-serif; background-color: #0A0A0C; }
        .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.03em; }
        .poster { aspect-ratio: 2 / 3; }
        .font-title-jp { font-family: 'Zen Old Mincho', serif;font-weight: 700; }
        .poster-frame {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
            transition: box-shadow 0.15s ease-in;
            pointer-events: none;
        }
        .group:hover .poster-frame {
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3);
        }
        .captions-hidden .poster-caption {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen text-[#EDEBF0] pb-20">

    {% include 'header.html' %}

        
  

    <main class="max-w-6xl mx-auto px-6 mt-8">
        <!-- ヘッダーから移動 -->
        <div class="max-w-6xl mx-auto pb-6 flex items-center justify-end">            
            <div class="flex items-center gap-4">
                <!-- トグルボタン -->
                <label class="flex items-center gap-2 text-sm text-[#B8B4C0] cursor-pointer">
                    <input type="checkbox" id="caption-toggle" checked class="sr-only">
                    <div id="toggle-track" class="w-9 h-5 bg-[#3ECF8E] rounded-full relative transition-colors">
                        <div id="toggle-thumb" class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full transition-transform translate-x-4"></div>
                    </div>
                    情報を表示
                </label>
                <!-- 並び替えプルダウン -->
                <div class="relative inline-block">
                    <select onchange="location.href='/?sort=' + this.value"
                            class="appearance-none bg-transparent text-sm text-[#B8B4C0] pr-6 py-1 cursor-pointer focus:outline-none">
                        <option value="name" {% if sort == 'name' %}selected{% endif %} class="bg-[#151418] text-[#B8B4C0]">作品名順</option>
                        <option value="date" {% if sort == 'date' %}selected{% endif %} class="bg-[#151418] text-[#B8B4C0]">登録日順</option>
                        <option value="score" {% if sort == 'score' %}selected{% endif %} class="bg-[#151418] text-[#B8B4C0]">スコア順</option>
                    </select>
                    <svg class="absolute right-0 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-[#8B8795] pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
            </div>
        </div>
        <!-- ヘッダーから移動 -->

        <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-4">

            {% for movie in movies %}
            <a href="/movie/tmdb/{{ movie[7] }}/{{ movie[6] }}?sort={{ sort }}" class="group">
                <div class="poster rounded overflow-hidden bg-[#1C1A22] flex items-end p-2 relative">
                    {% if movie[2] %}
                    <div class="absolute inset-0 overflow-hidden rounded">
                        <img src="{{ movie[2] }}" class="absolute inset-0 w-full h-full object-cover blur-xl scale-125 opacity-50 rounded">
                    </div>
                    <img src="{{ movie[2] }}" class="absolute inset-0 w-full h-full object-contain rounded">
                    <div class="poster-frame"></div>
                    {% else %}
                    <span class="relative text-xs text-[#EDEBF0]/70 font-title-jp tracking-wide">{{ movie[1] }}</span>
                    {% endif %}
                </div>
                <p class="poster-caption text-[11px] text-[#8B8795] font-title-jp mt-1.5 truncate {% if sort == 'score' %}text-center{% endif %}">
                    {% if sort == 'date' %}
                    {{ movie[4] }}
                    {% elif sort == 'score' %}
                    ★{{ movie[3] }}
                    {% else %}
                    {{ movie[1] }}
                    {% endif %}
                </p>
            </a>
            {% endfor %}

        </div>
    </main>

    <script>
        const toggle = document.getElementById('caption-toggle');
        const track = document.getElementById('toggle-track');
        const thumb = document.getElementById('toggle-thumb');

        toggle.addEventListener('change', function() {
            document.body.classList.toggle('captions-hidden', !this.checked);
            track.classList.toggle('bg-[#3ECF8E]', this.checked);
            track.classList.toggle('bg-[#2A2932]', !this.checked);
            thumb.classList.toggle('translate-x-4', this.checked);
        });
    </script>
</body>
</html>
