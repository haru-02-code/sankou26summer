<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>視聴ログ一覧</title>
</head>
<body>
    <h1>映画・アニメ視聴ログ</h1>

    <a href="/add.html">新規登録</a>

    <table border="1">
        <tr>
            <th>作品名</th>
            <th>ジャンル</th>
            <th>視聴日</th>
            <th>評価</th>
            <th>感想</th>
            <th>画像</th>
        </tr>
        {% for movie in movies %}
        <tr>
            <td>{{ movie[1] }}</td>
            <td>{{ movie[2] }}</td>
            <td>{{ movie[3] }}</td>
            <td>{{ movie[4] }}</td>
            <td>{{ movie[5] }}</td>
            <td>
                {% if movie[6] %}
                <img src="/{{ movie[6] }}" width="100">
                {% else %}
                なし
                {% endif %}
            </td>
            <td>
                <a href="/edit/{{ movie[0] }}">編集</a>
            </td>
            <td>
                <form action="/delete/{{ movie[0] }}" method="post">
                    <button type="submit">削除</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
