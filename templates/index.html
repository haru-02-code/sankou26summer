<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>視聴ログ一覧</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
    body { font-family: 'Inter', sans-serif; background-color: #0A0A0C; }
        .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.03em; }
        .poster { aspect-ratio: 2 / 3; }
        .font-title-jp { font-family: 'Zen Old Mincho', serif;font-weight: 700; }
        .poster-frame {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
            transition: box-shadow 0.15s ease-in;
            pointer-events: none;
        }
        .group:hover .poster-frame {
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body class="min-h-screen text-[#EDEBF0] pb-20">

    <header class="border-b border-[#232229] sticky top-0 bg-[#0A0A0C]/90 backdrop-blur z-10">
        <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
            <h1 class="font-display text-3xl tracking-wide">Watchive</h1>
            <div class="flex items-center gap-4">
                <select class="bg-[#151418] border border-[#2A2932] text-sm text-[#B8B4C0] rounded px-3 py-1.5">
                    <option>登録日順</option>
                    <option>作品名順</option>
                    <option>スコア順</option>
                </select>
                <a href="/add.html" class="bg-[#3ECF8E] text-[#0A0A0C] text-sm font-semibold px-4 py-1.5 rounded hover:opacity-90">
                    + 新規登録
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 mt-8">
        <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-4">

            {% for movie in movies %}
            <a href="/movie/{{ movie[0] }}" class="group">
                <div class="poster rounded overflow-hidden bg-[#1C1A22] flex items-end p-2 relative">
                    {% if movie[6] %}
                    <!-- ぼかし画像専用の入れ子コンテナ -->
                    <div class="absolute inset-0 overflow-hidden rounded">
                        <img src="/{{ movie[6] }}" class="absolute inset-0 w-full h-full object-cover blur-xl scale-125 opacity-50 rounded">
                    </div>
                    <img src="/{{ movie[6] }}" class="absolute inset-0 w-full h-full object-contain rounded">
                    <div class="poster-frame"></div>
                    {% else %}
                    <span class="relative text-xs text-[#EDEBF0]/70 font-title-jp tracking-wide">{{ movie[1] }}</span>
                    {% endif %}
                </div>
                <p class="text-[11px] text-[#8B8795] font-title-jp mt-1.5 truncate">{{ movie[1] }}</p>
            </a>
            {% endfor %}

        </div>
    </main>
</body>
</html>
